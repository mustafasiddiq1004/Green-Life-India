<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Panel | Green Life India</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- LOADING -->
<div id="loadingScreen" style="position:fixed;inset:0;display:grid;place-items:center;background:#f5faf1;z-index:9999;font-family:sans-serif;">
  <div style="text-align:center;color:#0b8f45;">
    <div style="font-size:32px;">☀</div>
    <div>Loading admin panel…</div>
  </div>
</div>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen" style="display:none;">
  <div class="login-box">
    <div class="brand" style="justify-content:center;margin-bottom:20px;">
      <img src="GLI-logo.png" alt="Green Life India logo">
      <span>Green Life <b>India</b></span>
    </div>
    <h1>Admin Login</h1>
    <p>Sign in to manage the gallery.</p>
    <form id="loginForm">
      <label>Email
        <input type="email" id="loginEmail" required autocomplete="email" placeholder="your-admin-email@gmail.com">
      </label>
      <label>Password
        <input type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••">
      </label>
      <button type="submit" class="btn btn-primary" id="loginBtn" style="width:100%;">
        <span id="loginBtnText">Sign In →</span>
      </button>
      <p id="loginError" class="error-msg"></p>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard" style="display:none;">
  <header class="admin-header">
    <div class="container admin-header-inner">
      <div class="brand">
        <img src="GLI-logo.png" alt="">
        <span>Green Life <b>India</b> — Admin</span>
      </div>
      <div class="admin-user">
        <span id="userEmail"></span>
        <button id="logoutBtn" class="btn-logout">Logout</button>
      </div>
    </div>
  </header>

  <main class="container admin-main">
    <section class="admin-card">
      <h2>Add New Project</h2>
      <form id="uploadForm">
        <div class="form-row">
          <label>Title
            <input type="text" id="pTitle" required placeholder="e.g. Home Rooftop — Dharampeth">
          </label>
          <label>Category
            <select id="pCategory" required>
              <option value="residential">Residential</option>
              <option value="commercial">Commercial</option>
              <option value="industrial">Industrial</option>
              <option value="institutional">Institutional</option>
            </select>
          </label>
        </div>
        <div class="form-row">
          <label>System Size
            <input type="text" id="pSize" required placeholder="e.g. 5 kW">
          </label>
          <label>System Type
            <input type="text" id="pType" placeholder="e.g. On-Grid, Hybrid">
          </label>
        </div>
        <label>Location
          <input type="text" id="pLocation" required placeholder="e.g. Dharampeth, Nagpur">
        </label>
        <label>Description
          <textarea id="pDescription" rows="3" required placeholder="Short description…"></textarea>
        </label>
        <label>Project Image <small>(JPG/PNG/WebP, max 5 MB)</small>
          <input type="file" id="pImage" accept="image/*" required>
        </label>
        <label>Video URL <small>(optional)</small>
          <input type="url" id="pVideo" placeholder="https://youtube.com/watch?v=...">
        </label>
        <div id="preview" class="preview"></div>
        <button type="submit" class="btn btn-primary" id="uploadBtn">
          <span id="uploadBtnText">Publish to Gallery →</span>
        </button>
        <p id="uploadMsg" class="status-msg"></p>
      </form>
    </section>

    <section class="admin-card">
      <h2>Manage Projects <small id="projectCount"></small></h2>
      <div id="projectsList" class="admin-projects"></div>
    </section>
  </main>
</div>

<!-- Firebase compat SDK (classic <script> tags — no modules) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

<!-- Config -->
<script src="firebase-config.js"></script>

<!-- Admin logic -->
<script>
window.__ADMIN_SCRIPT_LOADED__ = true;
console.log("🚀 Admin script starting…");
console.log("Firebase:", typeof firebase);
console.log("Config:", typeof window.FIREBASE_CONFIG);

(function () {
  "use strict";

  var loadingScreen = document.getElementById("loadingScreen");
  var loginScreen = document.getElementById("loginScreen");
  var dashboard = document.getElementById("dashboard");
  var loginForm = document.getElementById("loginForm");
  var loginError = document.getElementById("loginError");
  var loginBtn = document.getElementById("loginBtn");
  var loginBtnText = document.getElementById("loginBtnText");

  // Guard: Firebase SDK
  if (typeof firebase === "undefined") {
    loadingScreen.innerHTML = "<div style='color:#c0392b;padding:30px;text-align:center;font-family:sans-serif;'>❌ Firebase SDK failed to load.<br>Ad blocker may be blocking gstatic.com.<br>Disable it and refresh.</div>";
    return;
  }

  // Guard: Config
  if (!window.FIREBASE_CONFIG) {
    loadingScreen.innerHTML = "<div style='color:#c0392b;padding:30px;text-align:center;font-family:sans-serif;'>❌ firebase-config.js not loaded.<br>Check that the file exists on GitHub and is committed.</div>";
    return;
  }

  // Init
  firebase.initializeApp(window.FIREBASE_CONFIG);
  var auth = firebase.auth();
  var db = firebase.firestore();
  var storage = firebase.storage();

  console.log("✅ Firebase initialized. Project:", window.FIREBASE_CONFIG.projectId);

  // Login
  loginForm.addEventListener("submit", function (e) {
    e.preventDefault();
    loginError.textContent = "";
    loginError.style.color = "#617066";
    loginBtnText.textContent = "Signing in…";
    loginBtn.disabled = true;

    var email = document.getElementById("loginEmail").value.trim();
    var password = document.getElementById("loginPassword").value;

    console.log("🔐 Login attempt:", email);

    auth.signInWithEmailAndPassword(email, password)
      .then(function () {
        console.log("✅ Login succeeded");
      })
      .catch(function (err) {
        console.error("❌ Login failed:", err.code, err.message);
        loginError.textContent = explainError(err.code);
        loginError.style.color = "#c0392b";
        loginBtnText.textContent = "Sign In →";
        loginBtn.disabled = false;
      });
  });

  function explainError(code) {
    var map = {
      "auth/invalid-api-key": "❌ API key invalid. Check firebase-config.js.",
      "auth/unauthorized-domain": "❌ Domain not authorized. Add '" + location.hostname + "' in Firebase → Auth → Settings → Authorized domains.",
      "auth/invalid-credential": "❌ Wrong email or password.",
      "auth/user-not-found": "❌ No user with this email in Firebase Auth.",
      "auth/wrong-password": "❌ Wrong password.",
      "auth/operation-not-allowed": "❌ Email/Password sign-in is disabled in Firebase.",
      "auth/too-many-requests": "❌ Too many attempts. Wait 5 min.",
      "auth/network-request-failed": "❌ Network blocked. Disable ad blocker.",
      "auth/invalid-email": "❌ Invalid email format."
    };
    return map[code] || ("Login failed: " + code);
  }

  // Auth state
  auth.onAuthStateChanged(function (user) {
    console.log("👤 Auth state:", user ? user.email : "signed out");
    loadingScreen.style.display = "none";

    if (user && user.email === window.ADMIN_EMAIL) {
      loginScreen.style.display = "none";
      dashboard.style.display = "block";
      document.getElementById("userEmail").textContent = user.email;
      loadProjects();
    } else if (user) {
      alert("Not the admin account.\nLogged in: " + user.email + "\nExpected: " + window.ADMIN_EMAIL);
      auth.signOut();
    } else {
      loginScreen.style.display = "grid";
      dashboard.style.display = "none";
      loginBtn.disabled = false;
      loginBtnText.textContent = "Sign In →";
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", function () {
    auth.signOut();
  });

  // Preview
  document.getElementById("pImage").addEventListener("change", function (e) {
    var file = e.target.files[0];
    var preview = document.getElementById("preview");
    preview.innerHTML = file ? '<img src="' + URL.createObjectURL(file) + '" alt="Preview">' : "";
  });

  // Upload
  document.getElementById("uploadForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var uploadMsg = document.getElementById("uploadMsg");
    var uploadBtn = document.getElementById("uploadBtn");
    var uploadBtnText = document.getElementById("uploadBtnText");
    uploadMsg.textContent = "";
    uploadMsg.className = "status-msg";

    var title = document.getElementById("pTitle").value.trim();
    var category = document.getElementById("pCategory").value;
    var size = document.getElementById("pSize").value.trim();
    var type = document.getElementById("pType").value.trim();
    var location = document.getElementById("pLocation").value.trim();
    var description = document.getElementById("pDescription").value.trim();
    var videoUrl = document.getElementById("pVideo").value.trim();
    var file = document.getElementById("pImage").files[0];

    if (!file) { uploadMsg.textContent = "Please choose an image."; uploadMsg.className = "status-msg error"; return; }
    if (file.size > 5 * 1024 * 1024) { uploadMsg.textContent = "Image over 5 MB."; uploadMsg.className = "status-msg error"; return; }

    uploadBtn.disabled = true;
    uploadBtnText.textContent = "Uploading…";

    var ext = file.name.split(".").pop().toLowerCase();
    var path = "projects/" + Date.now() + "-" + Math.random().toString(36).slice(2) + "." + ext;

    storage.ref(path).put(file)
      .then(function (snap) { return snap.ref.getDownloadURL(); })
      .then(function (imageUrl) {
        return db.collection("projects").add({
          title: title, category: category, size: size, type: type,
          location: location, description: description,
          imageUrl: imageUrl, imagePath: path,
          videoUrl: videoUrl || null,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      })
      .then(function () {
        uploadMsg.textContent = "✓ Project published!";
        uploadMsg.className = "status-msg success";
        document.getElementById("uploadForm").reset();
        document.getElementById("preview").innerHTML = "";
        loadProjects();
      })
      .catch(function (err) {
        console.error("Upload error:", err);
        uploadMsg.textContent = "Upload failed: " + err.message;
        uploadMsg.className = "status-msg error";
      })
      .then(function () {
        uploadBtn.disabled = false;
        uploadBtnText.textContent = "Publish to Gallery →";
      });
  });

  // Load projects
  function loadProjects() {
    var list = document.getElementById("projectsList");
    list.innerHTML = '<div class="empty-state">Loading…</div>';
    db.collection("projects").orderBy("createdAt", "desc").get()
      .then(function (snap) {
        var items = snap.docs.map(function (d) {
          var data = d.data();
          data.id = d.id;
          return data;
        });
        document.getElementById("projectCount").textContent = "(" + items.length + ")";

        if (!items.length) {
          list.innerHTML = '<div class="empty-state">No projects yet.</div>';
          return;
        }

        list.innerHTML = items.map(function (p) {
          return '<div class="admin-project-row">' +
            '<img src="' + p.imageUrl + '" alt="">' +
            '<div><h4>' + esc(p.title) + '</h4>' +
            '<p>' + esc(p.category) + ' • ' + esc(p.size) + ' • ' + esc(p.location) + '</p></div>' +
            '<button class="btn-delete" data-id="' + p.id + '" data-path="' + esc(p.imagePath) + '">Delete</button>' +
            '</div>';
        }).join("");

        list.querySelectorAll(".btn-delete").forEach(function (btn) {
          btn.addEventListener("click", function () {
            delProject(btn.dataset.id, btn.dataset.path);
          });
        });
      })
      .catch(function (err) {
        console.error("Load error:", err);
        list.innerHTML = '<div class="empty-state">Failed to load: ' + esc(err.message) + '</div>';
      });
  }

  function delProject(id, path) {
    if (!confirm("Delete this project?")) return;
    var chain = Promise.resolve();
    if (path) {
      chain = storage.ref(path).delete().catch(function () {});
    }
    chain.then(function () {
      return db.collection("projects").doc(id).delete();
    }).then(loadProjects).catch(function (err) {
      alert("Delete failed: " + err.message);
    });
  }

  function esc(s) {
    s = s == null ? "" : String(s);
    return s.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
})();
</script>
</body>
</html>
